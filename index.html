<!DOCTYPE html>
<!-- 
===============================================================================
MINDSET-NER PORTAL LAUNCHER
NOTE: The full 1,600+ line application code is located in:
👉 static/index.html

HOW TO RUN:
1. VS Code Live Server: Right-click 'static/index.html' -> 'Open with Live Server'
2. With Full AI Backend: In terminal run 'python run.py' (opens http://127.0.0.1:8000)
===============================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b2545">
    <meta http-equiv="refresh" content="0; url=./static/index.html">
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <title>MINDSET-NER Portal | Launching...</title>
    <script>
        // Smooth and immediate redirection for Live Server & Localhost
        (function() {
            var currentPath = window.location.pathname;
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            
            // Check if already in static
            if (currentPath.indexOf('/static') === -1) {
                var basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                var target = basePath + 'static/index.html' + search + hash;
                window.location.replace(target);
            }
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #061529 0%, #0b2545 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }
        .launcher-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .launcher-card h2 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        .launcher-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn-launch {
            display: inline-block;
            background: linear-gradient(135deg, #ff9933 0%, #d97706 100%);
            color: #ffffff;
            padding: 0.85rem 1.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.05rem;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
            transition: transform 0.2s, background 0.2s;
        }
        .btn-launch:hover {
            transform: translateY(-2px);
            background: #b45309;
        }
        .tip-box {
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: left;
        }
        .tip-box code {
            background: #000;
            padding: 2px 6px;
            border-radius: 4px;
            color: #facc15;
        }
    </style>
</head>
<body>
    <div class="launcher-card">
        <div style="font-size: 3rem; margin-bottom: 0.8rem;">🧠</div>
        <h2>MINDSET-NER Portal</h2>
        <p>Redirecting to the official cognitive assistance portal...</p>
        <a href="./static/index.html" class="btn-launch">👉 Click here to Open Portal</a>
        <div class="tip-box">
            💡 <strong>VS Code Live Server Tip:</strong><br>
            Aap VS Code me <code>static/index.html</code> par Right-Click karke <strong>"Open with Live Server"</strong> karein, ya terminal me <code>python run.py</code> chalayein.
        </div>
    </div>
</body>
</html>
